<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FormSubmit 初期アクティベーション用</title>
</head>
<body style="padding: 50px; text-align: center;">
    <h2>FormSubmit 初期アクティベーション用フォーム</h2>
    <p>FormSubmitは、<b>一番最初の1回目</b>は通常のHTMLフォームから送信しないと有効化されません。</p>
    <p>下のボタンを押して送信してください。</p>
    
    <form action="https://formsubmit.co/info@top-vision102.co.jp" method="POST">
        <!-- 任意のテスト用データ -->
        <input type="hidden" name="テスト" value="アクティベーションテストです">
        <button type="submit" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">ここを押して初めての送信を行う</button>
    </form>
</body>
</html>
